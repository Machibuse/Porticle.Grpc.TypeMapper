syntax = "proto3";

option csharp_namespace = "Porticle.Grpc.UnitTests";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";


message TestMessage {
  string single_guid = 1;
  google.protobuf.StringValue single_nullable_guid = 2;
  google.protobuf.StringValue single_nullable_string = 4;
  repeated string list_of_guid = 5;
  string single_decimal = 8;
  google.protobuf.StringValue single_nullable_decimal = 9;
  repeated string list_of_decimal = 10;
  google.protobuf.Timestamp single_date_time = 11;
  google.protobuf.Timestamp single_date_time_offset = 12;
}

message TestMessageMapped {
  // [GrpcGuid]
  string single_guid = 1;

  // [GrpcGuid]
  google.protobuf.StringValue single_nullable_guid = 2;

  // [NullableString]
  google.protobuf.StringValue single_nullable_string = 4;

  // [GrpcGuid]
  repeated string list_of_guid = 5;

  TestEnum enum_required = 6;

  // [NullableEnum]
  optional TestEnum enum_optional = 7;

  // [Decimal]
  string single_decimal = 8;

  // [Decimal]
  google.protobuf.StringValue single_nullable_decimal = 9;

  // [Decimal]
  repeated string list_of_decimal = 10;

  // [DateTime]
  google.protobuf.Timestamp single_date_time = 11;

  // [DateTimeOffset]
  google.protobuf.Timestamp single_date_time_offset = 12;
}

//////////////////////////////////////////////
// Test comment to check marker comment 
//////////////////////////////////////////////
message TestMessageEnum1 {
  optional TestEnum enum_optional = 7;
}
message TestMessageEnum2 {
  // [NullableEnum]
  optional TestEnum enum_optional = 7;
}


message TestMessageEnum3 {
  
  optional TestEnum foo_bar = 7;
}


// [NullableReferenceTypes]
message TestMessageNullableRef {
  string required_string = 1;
  google.protobuf.StringValue nullable_string = 2;
  TestMessageEnum1 sub_message = 3;
  TestEnum enum_required = 4;
  optional TestEnum enum_optional = 5;
  int32 some_int = 6;
  int64 some_long = 7;
  uint32 some_uint = 8;
  uint64 some_ulong = 9;
  double some_double = 10;
  float some_float = 11;
  bool some_bool = 12;
  bytes some_bytes = 13;
  sint32 some_sint = 14;
  sint64 some_slong = 15;
  fixed32 some_fixed32 = 16;
  fixed64 some_fixed64 = 17;
  sfixed32 some_sfixed32 = 18;
  sfixed64 some_sfixed64 = 19;
  repeated string some_repeated_string = 20;
  map<string, string> some_map = 21;
}

message TestMessageNullableRefUnmapped {
  string required_string = 1;
  google.protobuf.StringValue nullable_string = 2;
  TestMessageEnum1 sub_message = 3;
}

message TestMessageGuidOneof {
  oneof identifier {
    string guid = 1;
    string text = 2;
  }
}

message TestMessageMappedGuidOneof {
  oneof identifier {
    // [GrpcGuid]
    string guid = 1;
    string text = 2;
  }
}

message TestMessageWithNestedGuidOneof {
  message NestedMappedGuidOneof {
    oneof identifier {
      // [GrpcGuid]
      string guid = 1;
      string text = 2;
    }
  }

  NestedMappedGuidOneof nested = 1;
}

message TestMessageGuidOneofWithNestedCollision {
  oneof outer_identifier {
    // [GrpcGuid]
    string guid = 1;
  }

  message NestedUnmappedGuidOneof {
    oneof nested_identifier {
      string guid = 1;
    }
  }

  NestedUnmappedGuidOneof nested = 2;
}

enum TestEnum
{
  FOO = 0;
  BAR = 1;
}

// Fields named like their type: the property name "Timestamp" collides with the type name Timestamp
message TestMessageTimestampNamedDateTime {
  // [DateTime]
  google.protobuf.Timestamp timestamp = 1;
}

message TestMessageTimestampNamedDateTimeOffset {
  // [DateTimeOffset]
  google.protobuf.Timestamp timestamp = 1;
}

// Field-level nullability attribute markers
message TestMessageNullabilityFields {
  // [NotNull]
  TestMessageEnum1 not_null_message = 1;

  // [DisallowNull]
  TestMessageEnum1 disallow_null_message = 2;

  // [NotNull] [DisallowNull]
  TestMessageEnum1 both_message = 3;

  TestMessageEnum1 plain_message = 4;

  // [NotNull]
  google.protobuf.Timestamp not_null_timestamp = 5;

  // [DateTime] [NotNull]
  google.protobuf.Timestamp not_null_date_time = 6;

  // [DateTimeOffset] [DisallowNull]
  google.protobuf.Timestamp disallow_null_date_time_offset = 7;

  // [NotNull] not supported on strings - ignored with a build warning
  string not_eligible_string = 8;

  // [DisallowNull] not supported on repeated fields - ignored with a build warning
  repeated TestMessageEnum1 not_eligible_repeated = 9;
}

// Message-level defaults: [NotNull] [DisallowNull]
message TestMessageNullabilityDefaults {
  TestMessageEnum1 sub_message = 1;

  // [DateTimeOffset]
  google.protobuf.Timestamp created_at = 2;

  string some_string = 3;

  int32 some_int = 4;

  repeated TestMessageEnum1 repeated_message = 5;

  oneof choice {
    TestMessageEnum1 choice_message = 6;
    string choice_text = 7;
  }

  // [MaybeNull]
  TestMessageEnum1 maybe_null_message = 8;

  // [MaybeNull] [DisallowNull]
  TestMessageEnum1 maybe_null_disallow_message = 9;

  message Nested {
    TestMessageEnum1 nested_sub = 1;
  }

  Nested nested = 10;
}

// [NullableReferenceTypes] [NotNull]
message TestMessageNullabilityNullableRef {
  TestMessageEnum1 sub_message = 1;
}